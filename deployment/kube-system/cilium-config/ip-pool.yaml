apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: local-pool
spec:
  blocks:
    # Written as start/stop, not a CIDR, because .200-.215 is not a CIDR: it spans
    # the 192.168.100.192/28 boundary. An earlier revision did write it as
    # "192.168.100.200/28", which LB-IPAM normalized to 192.168.100.192/28 -- so the
    # pool quietly handed out .192-.199 as well, and .200 sat inside it only by that
    # accident (#8).
    #
    # The floor stayed at .192 for a while longer because default/test-nginx held
    # .192 and moving the floor would have evicted it onto the .200 that
    # ../cilium/values.yaml pins for the ingress. That service was an untracked
    # hand-made test fixture (#16) and has since been deleted, so the floor is free
    # to be what it was always meant to be.
    #
    # .200 is the address ../cilium/values.yaml pins for kube-system/cilium-ingress
    # via lbipam.cilium.io/ips -- keep the two in step.
    # infrastructure/scripts/check_deployments.sh asserts that containment, including
    # the CIDR normalization above, so a drifting pin fails before it reaches the
    # cluster and wedges every Ingress on IPAMRequestSatisfied=False.
    - start: "192.168.100.200"
      stop: "192.168.100.215"
