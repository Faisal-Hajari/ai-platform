cilium:
  # Required: with --skip-phases=addon/kube-proxy there is no kube-proxy, so nothing
  # programs the 10.96.0.1 ClusterIP until Cilium is up. Cilium must therefore reach
  # the API server directly or it deadlocks on itself at startup.
  k8sServiceHost: 192.168.100.19
  k8sServicePort: 6443
  kubeProxyReplacement: true
  l2announcements:
    enabled: true
  externalIPs:
    enabled: true
  operator:
    replicas: 1

  # Cilium serves Ingress itself -- no separate ingress controller. Envoy runs in the
  # cilium-agent, so L7 routing happens on the same datapath as the rest of the network.
  ingressController:
    enabled: true
    # Own the unclassed Ingresses too, so `kubectl get ingress` objects need no
    # ingressClassName to be picked up.
    default: true
    # shared: every Ingress is fronted by one LoadBalancer service
    # (kube-system/cilium-ingress) instead of one service -- and one IP -- per Ingress.
    loadbalancerMode: shared
    service:
      type: LoadBalancer
      # Pin the shared entrypoint to a fixed address out of the CiliumLoadBalancerIPPool
      # (see ../cilium-config/ip-pool.yaml) so ingress hostnames have a stable A record.
      # L2 announcements ARP for it on eno1, so it is reachable on the LAN directly.
      loadBalancerIP: 192.168.100.200
