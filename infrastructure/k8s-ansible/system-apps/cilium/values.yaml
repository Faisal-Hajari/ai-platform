cilium:
  # Required: with --skip-phases=addon/kube-proxy there is no kube-proxy, so nothing
  # programs the 10.96.0.1 ClusterIP until Cilium is up. Cilium must therefore reach
  # the API server directly or it deadlocks on itself at startup.
  k8sServiceHost: 192.168.100.19
  # Also `kubeadm init --apiserver-advertise-address`: the playbook reads k8sServiceHost
  # for it, so kubeadm and Cilium cannot name different addresses. See the host-identity
  # block at the top of infrastructure/k8s-ansible/playbook.yml, which asserts this
  # address is on the node -- and, once a cluster exists, that it is the one the cluster
  # was built to advertise.
  #
  # The port is the same shape of duplication, left alone: kubeadm gets no
  # --apiserver-bind-port and defaults to 6443, which is what this declares. They agree by
  # shared default rather than by luck, and a port does not move the way a DHCP lease
  # does -- but do not "fix" one of them alone.
  k8sServicePort: 6443
  kubeProxyReplacement: true

  # The pod range. This is the ONLY place it is written down -- the Ansible playbook
  # reads this key to build `kubeadm init --pod-network-cidr`, so kubeadm and Cilium
  # cannot disagree about it.
  #
  # It has to be set explicitly, because kubeadm does not feed it. In cluster-pool
  # mode Cilium ignores --pod-network-cidr entirely and allocates node /24s out of
  # clusterPoolIPv4PodCIDRList, whose chart default is 10.0.0.0/8. That default
  # encloses the kubeadm default service range 10.96.0.0/12, so the pod allocator
  # could in principle hand out a block on top of the service CIDR -- and with
  # kubeProxyReplacement the datapath keys service handling off that range, so such
  # an address is ambiguous. Setting this key alone would fix that overlap -- but it
  # would leave --pod-network-cidr describing a range nothing uses, since kubeadm's
  # value reaches only kube-controller-manager's --cluster-cidr and node.spec.podCIDR,
  # which Cilium does not consult and, with no kube-proxy, nothing else reads either.
  # Hence both, from this one value.
  #
  # 10.244.0.0/16 is disjoint from 10.96.0.0/12. At the default /24 mask size that is
  # 256 nodes, which this cluster will not outgrow.
  #
  # REBUILD-ONLY. `helm upgrade` will push a new value at a running cluster quite
  # happily, and it will not take: a live node's CiliumNode already holds a /24 out of
  # the old pool and the operator cannot renumber it, while kubeadm's --pod-network-cidr
  # was fixed at init.
  #
  # This used to say MERGE FIRST as well, because the file had two readers on two
  # revisions -- the playbook on the local checkout, ArgoCD on main -- so rebuilding from
  # an unmerged branch brought pods up on the new pool and then let selfHeal put the old
  # one back. That reader is gone (see ../README.md): a change here reaches the cluster
  # only through the checkout the playbook reads, and through nothing else.
  #
  # So: infrastructure/scripts/destroy_cluster.sh --keep-packages, THEN re-run the
  # playbook, which reads this file both for `kubeadm init --pod-network-cidr` and as the
  # chart's values. (--keep-packages leaves kubeadm, containerd and the resolved chart
  # cache in place, so the rebuild is the play alone; a full destroy works too and is
  # simply slower.)
  ipam:
    operator:
      clusterPoolIPv4PodCIDRList: ["10.244.0.0/16"]
  l2announcements:
    enabled: true
  externalIPs:
    enabled: true
  operator:
    replicas: 1

  # Cilium serves Ingress itself -- no separate ingress controller. L7 routing runs on
  # the standalone cilium-envoy DaemonSet (envoy.enabled defaults to true in 1.19, so
  # that DaemonSet is already running); enabling this adds no new workload, it just
  # gives the Envoy we already pay for something to do.
  ingressController:
    enabled: true
    # Own the unclassed Ingresses too, so `kubectl get ingress` objects need no
    # ingressClassName to be picked up.
    default: true
    # shared: every Ingress is fronted by one LoadBalancer service
    # (kube-system/cilium-ingress) instead of one service -- and one IP -- per Ingress.
    loadbalancerMode: shared
    service:
      annotations:
        # Pin the shared entrypoint so ingress hostnames have a stable A record.
        # config/ip-pool.yaml names this range explicitly, so .200 is an address that
        # file spells out rather than one it happens to cover -- keep the two in step;
        # infrastructure/scripts/check_deployments.sh fails if they drift, and
        # .github/workflows/check-deployments.yml runs it on every change here. The
        # playbook applies both in one step now, so they can no longer disagree while
        # two Applications sync in an arbitrary order -- but they can still be edited
        # apart, which is what the check is for.
        # LB-IPAM's own annotation, rather than spec.loadBalancerIP, which k8s
        # deprecated in 1.24.
        lbipam.cilium.io/ips: "192.168.100.200"
