apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: local-pool
spec:
  blocks:
    # Written as start/stop, not a CIDR, because .200-.215 is not a CIDR: it spans
    # the 192.168.100.192/28 boundary. An earlier revision did write it as
    # "192.168.100.200/28", which LB-IPAM normalized to 192.168.100.192/28 -- so the
    # pool quietly handed out .192-.199 as well, and .200 sat inside it only by that
    # accident (#8).
    #
    # The floor stayed at .192 for a while longer because default/test-nginx held
    # .192 and moving the floor would have evicted it onto the .200 that
    # ../values.yaml pins for the ingress. That service was an untracked
    # hand-made test fixture (#16) and has since been deleted, so the floor is free
    # to be what it was always meant to be.
    #
    # .200 is the address ../values.yaml pins for kube-system/cilium-ingress via
    # lbipam.cilium.io/ips -- keep the two in step.
    # infrastructure/scripts/check_deployments.sh asserts that containment, including
    # the CIDR normalization above, and .github/workflows/check-deployments.yml runs it
    # on every change to this chart. That run going red is the warning that arrives
    # before the cluster's, which is IPAMRequestSatisfied=False and every Ingress dead --
    # a signal, not a merge gate, so do not sail past it.
    #
    # The other constraint on this range is the LAN it is on. config/l2-policy.yaml
    # announces these addresses over ARP on one named interface, and they only reach
    # anything while they sit on that interface's subnet -- 192.168.100.0/24, which is a
    # DHCP lease on the node and is written down nowhere in this repo. No check here can
    # see that, so infrastructure/k8s-ansible/playbook.yml asserts it against the host
    # before it builds anything (#39). Moving this range to another subnet means moving
    # the interface with it, and there is no cluster-side warning if you do not: LB-IPAM
    # allocates happily out of a range nothing announces.
    - start: "192.168.100.200"
      stop: "192.168.100.215"
