[defaults]
# host_key_checking is left at Ansible's default (on). It used to be disabled here, which
# was inert while inventory.ini is a single ansible_connection=local host -- but it is a
# config-file setting, not a per-host one, so it would silently apply to the first real
# SSH node added and accept whatever key answered. Add that node's key to known_hosts
# instead.
inventory = inventory.ini

[ssh_connection]
pipelining = True