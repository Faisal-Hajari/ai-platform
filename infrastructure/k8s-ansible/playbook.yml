---
- name: Setup Kubernetes
  hosts: k8s-cluster
  become: true

  # Kubernetes and ArgoCD are pinned inline below, Cilium in the chart this play
  # deploys. Helm is fetched as a binary rather than from a signed apt repo, so it is
  # pinned here with the SHA256 of the release artefact itself. A checksum published
  # beside the download only proves the bytes arrived intact -- it says nothing about
  # which version a run picked, so resolving the version at runtime (from a branch tip,
  # as this used to do) meant two nodes bootstrapped weeks apart got different tooling.
  # Bumping the version means replacing its checksums too: they are per version and per
  # architecture.
  vars:
    helm_version: v3.21.4
    helm_sha256:
      amd64: 61f88ab166748cb19604d7884cb100ae9ccb13804ddeb98e08af167eacbb6a14
      arm64: b54c04b4e0b2540bbdc08c17a121dab70e9a2ed0de5705528fec68a5fd3b85a7
    # Everything ArgoCD needs in order to run, and nothing else -- the membership rule is
    # in system-apps/README.md. These are deployed by this play; deployment/ is ArgoCD's
    # half and this play never applies anything from it.
    system_apps_dir: "{{ repo_path }}/infrastructure/k8s-ansible/system-apps"
    cilium_chart_dir: "{{ system_apps_dir }}/cilium"
    # Ours to name -- nothing outside this play refers to it. ArgoCD finds it by label and
    # pairs it to a repository by URL, not by name.
    argocd_repo_secret_name: repo-ai-platform

  # Everything here is settled by the repo and the vault alone, so none of it needs the
  # machine. The deploy key assert used to sit ~450 lines in, behind kubeadm init, Cilium
  # and the ArgoCD install: a cold run against an incomplete vault burnt the whole bootstrap
  # before mentioning the one thing it needed up front.
  pre_tasks:
    # ArgoCD pairs a credential to a repository by URL, so a credential registered for a URL
    # the ApplicationSet does not use is not an error, it is a silent no-op -- the very
    # failure the credential task exists to end. Read the URL back out of the ApplicationSet
    # rather than restating it, the same way the Cilium install reads its values straight out
    # of the chart it deploys.
    - name: Read the ApplicationSet
      set_fact:
        argocd_appset: "{{ lookup('file', system_apps_dir + '/argocd/applicationset.yaml') | from_yaml }}"

    # Only the generator's repo gets a credential, so a second generator would clone
    # uncredentialed and a template pointing elsewhere would sync uncredentialed -- both
    # silently. Assert the shape the credential task assumes rather than trusting index 0.
    - name: Assert the ApplicationSet clones exactly one repository
      assert:
        that:
          - argocd_appset.spec.generators | length == 1
          - argocd_appset.spec.generators[0].git.repoURL == argocd_appset.spec.template.spec.source.repoURL
        fail_msg: >-
          {{ argocd_appset.metadata.name }} has
          {{ argocd_appset.spec.generators | length }} generator(s), cloning
          {{ argocd_appset.spec.generators | map(attribute='git.repoURL') | join(', ') }},
          and deploys from {{ argocd_appset.spec.template.spec.source.repoURL }}. Only one
          repository gets a credential below, so anything else fails to sync.
        success_msg: "{{ argocd_appset.metadata.name }} clones {{ argocd_appset.spec.generators[0].git.repoURL }}"

    # Checked after trimming, and for both PEM delimiters rather than merely for length: a
    # vault entry left blank, left as whitespace, half-pasted, or holding the public half by
    # mistake all yield a well-formed Secret containing an unusable key -- the outcome the
    # credential task is written to avoid. Both delimiters, because they fail differently:
    # the header is what a .pub or a stray passphrase lacks, and the footer is what a paste
    # truncated at the end lacks, which is the more likely accident of the two. The gate at
    # the end of the ArgoCD section would catch these too, but only after the whole
    # bootstrap has run, and only as a clone failure rather than as this message.
    - name: Assert the ArgoCD deploy key is in the vault
      assert:
        that:
          - argocd_deploy_key | trim | length > 0
          - "'-----BEGIN' in argocd_deploy_key"
          - "'-----END' in argocd_deploy_key"
        fail_msg: >-
          vault_argocd_deploy_key is missing or unusable in
          group_vars/k8s-master/vault.yml. ArgoCD needs the private half of a GitHub deploy
          key with read access to this repo; generate one with
          `ssh-keygen -t ed25519 -N '' -C argocd -f argocd_deploy_key`, add the public half
          under the repo's Deploy keys on GitHub, then put the private half in the vault
          with
          `ansible-vault edit group_vars/k8s-master/vault.yml`.
        success_msg: the ArgoCD deploy key is present

    # The delimiters cannot see a passphrase -- an encrypted key is byte-for-byte
    # conventional at both ends -- and ArgoCD has nowhere to enter one, so that is one more
    # well-formed Secret holding an unusable key. It is also the failure the command above
    # used to walk you into, since ssh-keygen prompts for a passphrase unless given -N.
    # OpenSSH stores the cipher name in the clear at the head of the base64 body, so an
    # unencrypted key always starts "openssh-key-v1\0" then "none"; an encrypted one names
    # its cipher there instead. Checked identical across ed25519, RSA and ECDSA.
    #
    # This does require the OpenSSH container, which is what ssh-keygen writes unless told
    # otherwise -- a `-m PEM` key is rejected here. That is a constraint worth making rather
    # than hiding, so the message says so and how to convert.
    - name: Assert the ArgoCD deploy key has no passphrase
      assert:
        that: "'b3BlbnNzaC1rZXktdjEAAAAABG5vbmU' in argocd_deploy_key"
        fail_msg: >-
          vault_argocd_deploy_key is passphrase-protected, or is not an OpenSSH-format key.
          ArgoCD has nowhere to enter a passphrase, so it cannot use an encrypted key --
          regenerate it with `-N ''`. If it is a PEM key, `ssh-keygen -p -N '' -f <key>`
          rewrites it in OpenSSH format; this assert reads the cipher name out of that
          format and cannot see inside any other.
        success_msg: the ArgoCD deploy key is unencrypted

  tasks:
    # ── Host identity ─────────────────────────────────────
    # Read straight out of the values file the Cilium release is rendered from further
    # down, so kubeadm and Cilium cannot be told different things about the same host.
    # This used to be a defence against a second renderer as well -- ArgoCD syncing this
    # chart with selfHeal, reconciling away whatever the bootstrap had set. There is no
    # second renderer any more (see system-apps/README.md); the single-sourcing here is
    # now only about kubeadm, which reads none of this file itself.
    #
    # First in the play, ahead of everything else, because the asserts below decide
    # whether this run can work at all. A moved DHCP lease should abort a pristine host,
    # not one that has already had swap disabled, /etc/fstab rewritten, sysctl files
    # dropped and kubeadm installed and held.
    - name: Read the Cilium values
      set_fact:
        cilium_values: "{{ lookup('file', cilium_chart_dir + '/values.yaml') | from_yaml }}"

    # Single source of truth for the pod range. Cilium in cluster-pool mode does not
    # read --pod-network-cidr, and kubeadm does not read clusterPoolIPv4PodCIDRList, so
    # both have to be told -- from the same value, or they drift into the overlap
    # values.yaml explains at length.
    - name: Resolve the pod CIDR
      set_fact:
        pod_cidr: "{{ cilium_values.cilium.ipam.operator.clusterPoolIPv4PodCIDRList | first }}"

    # Same argument, for the API server address. Cilium dials k8sServiceHost directly --
    # with no kube-proxy it cannot fall back to the 10.96.0.1 ClusterIP -- while kubeadm,
    # given no --apiserver-advertise-address, picks the address on the default route.
    # Two independent determinations that agree only by luck: the node's address is a
    # DHCP lease, so a new lease or a second NIC changing the default route makes kubeadm
    # advertise one address while values.yaml still names the old one. That is precisely
    # the deadlock recover_cilium.sh exists to undo. Declare it once, feed both.
    - name: Resolve the API server address
      set_fact:
        apiserver_advertise_address: "{{ cilium_values.cilium.k8sServiceHost }}"

    # Not ansible_all_ipv4_addresses: that includes cilium_host, whose /32 out of the pod
    # range is on this host and is useless as an advertise address -- accepting it would
    # wave through exactly the deadlock these asserts exist to prevent. Filter out the
    # interfaces Cilium and the container runtime create. Deliberately NOT narrowed to
    # ansible_default_ipv4.address: binding a non-default NIC is a legitimate thing to
    # want on a multi-NIC box, and this check should not forbid it.
    - name: Resolve the NICs that could carry the API server address
      set_fact:
        node_lan_nics: >-
          {{ ansible_facts['interfaces']
             | reject('search', '^(lo$|cilium_|lxc|cni|veth|docker|flannel|kube)')
             | map('extract', ansible_facts) | list }}

    # Both ipv4 and ipv4_secondaries. Ansible files only the first non-secondary address
    # of an interface under `ipv4`; every later one goes to `ipv4_secondaries`. Reading
    # `ipv4` alone would reject a LAN address added alongside a DHCP lease -- a static
    # address, a VIP, anything from `ip addr add` on a NIC that already had one -- and
    # abort the play over an address that is on the host and perfectly usable. Failing
    # that way round is worse than being slightly permissive: an unfiltered bridge here
    # only matters if someone declares its address as k8sServiceHost.
    #
    # unique because a labelled alias (`ip addr add ... label eno1:0`) is filed twice --
    # once on the alias entry, once appended to the parent device -- and both reach this
    # list. Membership is unaffected either way; this is so the address list in the
    # failure message below does not stutter at the operator reading it.
    - name: Resolve the addresses usable as an API server advertise address
      set_fact:
        node_lan_addresses: >-
          {{ ((node_lan_nics | selectattr('ipv4', 'defined') | map(attribute='ipv4.address') | list)
              + (node_lan_nics | selectattr('ipv4_secondaries', 'defined')
                 | map(attribute='ipv4_secondaries') | flatten
                 | map(attribute='address') | list))
             | unique | list }}

    - name: Assert the declared API server address is on this host
      assert:
        that: apiserver_advertise_address in node_lan_addresses
        fail_msg: >-
          values.yaml declares k8sServiceHost={{ apiserver_advertise_address }}, but this
          host's usable addresses are {{ node_lan_addresses | join(', ') }} -- most likely
          the DHCP lease moved. Point k8sServiceHost in
          {{ cilium_chart_dir }}/values.yaml at the address this node actually holds, and
          give the node a reservation.
        success_msg: >-
          API server will advertise {{ apiserver_advertise_address }}, which this host holds

    # The assert above is the right question only before kubeadm init. Afterwards the
    # invariant is not "the declared address is on this host" but "the declared address is
    # the one the cluster was built to advertise" -- and those come apart in the second
    # half of the very scenario the message above describes. Move the lease, edit
    # k8sServiceHost as instructed, and the address is now on the host, so the assert above
    # goes green; but kubeadm init is skipped by its `creates:` guard, so the API server
    # still advertises the old address with SANs to match, and the run fails later as a
    # confusing kubectl error instead of a named assert.
    - name: Read the kubeconfig of an existing cluster
      slurp:
        src: /etc/kubernetes/admin.conf
      register: admin_conf
      failed_when: false

    # Parsed in its own task, not inline in fail_msg below: assert finalizes fail_msg on
    # every run, pass or fail, so an expression that can raise there breaks runs that were
    # about to succeed. from_yaml can still raise here, on an admin.conf that exists but is
    # truncated -- deliberately left to fail, because unlike the fail_msg case it only
    # fires when the file really is broken, and the error names the file and the line.
    #
    # admin.conf is a proxy: what has to match is the API server's --advertise-address and
    # its serving-cert SANs, which this only records as they were at init. They can be
    # desynced by hand-editing admin.conf, though the recovery for a moved lease
    # (kubeadm init phase certs apiserver, then phase kubeconfig admin) rewrites both.
    - name: Resolve the address the existing cluster was built to advertise
      set_fact:
        built_apiserver_host: >-
          {{ (admin_conf.content | b64decode | from_yaml).clusters[0].cluster.server
             | urlsplit('hostname') }}
      when: admin_conf.content is defined

    - name: Assert the existing cluster already advertises the declared address
      assert:
        that: built_apiserver_host == apiserver_advertise_address
        fail_msg: >-
          This cluster was built advertising {{ built_apiserver_host }}, but values.yaml
          now declares k8sServiceHost={{ apiserver_advertise_address }}. The advertise
          address and the serving-cert SANs were fixed at kubeadm init, so editing
          values.yaml fixes only Cilium's half -- regenerate the certs or rebuild.
        success_msg: >-
          Existing cluster already advertises {{ apiserver_advertise_address }}
      when: admin_conf.content is defined

    # ── Swap ──────────────────────────────────────────────
    # swapoff -a is unconditional, so on its own it reports a change on every run for the
    # rest of the cluster's life -- long after `Remove swap from fstab` below made sure
    # there is nothing left to turn off. Gate it on the fact instead of silencing it with
    # `changed_when: false`: a node that really does come up with swap on is a change,
    # and should still be reported as one.
    - name: Disable swap
      command: swapoff -a
      when: ansible_facts['swaptotal_mb'] | default(0) | int > 0

    - name: Remove swap from fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '#\1'

    # ── Kernel modules & sysctl ───────────────────────────
    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Set sysctl params
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/k8s.conf
        reload: true
      loop:
        - { key: net.bridge.bridge-nf-call-iptables, value: "1" }
        - { key: net.bridge.bridge-nf-call-ip6tables, value: "1" }
        - { key: net.ipv4.ip_forward, value: "1" }

    # ── Containerd ────────────────────────────────────────
    - name: Install containerd
      apt:
        name: containerd
        state: present
        update_cache: true

    - name: Create containerd config directory
      file:
        path: /etc/containerd
        state: directory

    # kubelet is configured for the systemd cgroup driver, so containerd has to use it
    # too; a mismatch leaves both managing the same cgroups and the node gets unstable
    # under memory pressure. Only `containerd config default` emits a CRI runtime section
    # with a SystemdCgroup key to flip -- the Ubuntu package ships a commented stub that
    # has no such key. Guarding generation on `creates:` therefore left the stub in place,
    # and the replace below then matched nothing and reported ok: a green run over a node
    # that never got the setting. Guard on the content we need instead of the file's
    # existence, and assert afterwards so a future silent no-op fails loudly.
    - name: Check for an existing containerd config
      stat:
        path: /etc/containerd/config.toml
      register: containerd_config_stat

    # Gated on stat rather than `failed_when: false`, so that a config we cannot read for
    # some other reason fails the run. Swallowing every slurp error would leave `content`
    # undefined, read as "no SystemdCgroup", and truncate a working config -- losing any
    # node-local registry mirror, proxy or sandbox_image settings with it.
    - name: Read the current containerd config
      slurp:
        path: /etc/containerd/config.toml
      when: containerd_config_stat.stat.exists
      register: containerd_config

    - name: Generate default containerd config
      shell: containerd config default > /etc/containerd/config.toml
      when: "'SystemdCgroup' not in (containerd_config.content | default('') | b64decode)"
      notify: restart containerd

    - name: Enable SystemdCgroup in containerd config
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'
      notify: restart containerd

    # Neither config this play normally sees reaches here with anything to match.
    # `containerd config default` output enables CRI and has no disabled_plugins line at
    # all; the Ubuntu package's stub does ship `disabled_plugins = ["cri"]`, but it has no
    # SystemdCgroup either, so the guard above is true against it and generation has
    # already overwritten it by the time this task runs. Generation is skipped only when
    # the config already has SystemdCgroup, which by definition means it is not the stub.
    #
    # What is left is the case worth keeping the task for: a config that is neither --
    # hand-rolled, or carried across an upgrade -- holding SystemdCgroup and a live
    # `disabled_plugins = ["cri"]` at once. containerd would come up with no CRI service
    # for kubelet to talk to, and the assert below would not catch it, because it only
    # reads the cgroup driver.
    - name: Enable CRI plugin in containerd config
      replace:
        path: /etc/containerd/config.toml
        regexp: '^disabled_plugins = \["cri"\]'
        replace: '#disabled_plugins = ["cri"]'
      notify: restart containerd

    - name: Re-read the containerd config
      slurp:
        path: /etc/containerd/config.toml
      register: containerd_config_final

    - name: Assert containerd is set to the systemd cgroup driver
      assert:
        that: "'SystemdCgroup = true' in (containerd_config_final.content | b64decode)"
        fail_msg: >-
          /etc/containerd/config.toml has no `SystemdCgroup = true`, so containerd would
          run with cgroupfs while kubelet uses systemd.
        success_msg: containerd is set to the systemd cgroup driver

    - name: Enable containerd
      service:
        name: containerd
        state: started
        enabled: true

    # The assert above reads the file; it says nothing about what the running daemon
    # loaded. A restart notified by this run only reaches the daemon if the run gets as far
    # as the flush below -- interrupt it in between and the next run finds a correct file,
    # changes nothing, notifies nothing, and passes its assert over a containerd still on
    # cgroupfs: the same silent divergence this playbook is meant to end. So take the
    # decision from the daemon instead of from this run's bookkeeping. containerd reads
    # config.toml only at startup, so a config newer than the process is a config the
    # process has not read.
    - name: Check whether the running containerd predates its config
      shell: |
        started=$(systemctl show containerd --property=ExecMainStartTimestamp --value)
        [ -n "$started" ] || exit 0
        [ "$(stat -c %Y /etc/containerd/config.toml)" -ge "$(date -d "$started" +%s)" ]
      register: containerd_predates_config
      changed_when: containerd_predates_config.rc == 0
      failed_when: false
      notify: restart containerd

    # kubeadm init below talks to containerd, so a pending restart has to happen now
    # rather than at the end of the play.
    - name: Restart containerd now if it has not loaded the current config
      meta: flush_handlers

    # ── kubeadm, kubelet, kubectl ─────────────────────────
    - name: Install dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present

    - name: Create keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Add Kubernetes apt key
      shell: |
        curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.36/deb/Release.key | \
        gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Add Kubernetes apt repository
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.36/deb/ /

    - name: Install kubeadm kubelet kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold kubeadm kubelet kubectl at current version
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    # ── Clock ─────────────────────────────────────────────
    # chrony ships with `makestep 1 3`, so it steps the clock outright for its first
    # few updates after boot. If kubelet and containerd are already recording container
    # lifecycle timestamps when that jump happens, their bookkeeping ends up inverted
    # (a container finishing hours before it started) and kubelet can decide a healthy
    # container died. It then retries CreateContainer forever against a name reservation
    # held by a half-created container -- a wedge that survives restarting either daemon,
    # because containerd re-reserves the name from the orphan's record in bolt on startup.
    # See infrastructure/scripts/recover_apiserver.sh to clear a node already stuck.
    #
    # chrony-wait blocks until the clock is within 0.1s, which is what makes
    # time-sync.target mean anything; the drop-ins hold both daemons behind it. Cost: on
    # a boot where NTP is unreachable both daemons start up to 180s late, bounded by
    # chrony-wait's own TimeoutStartSec -- the boot does not hang.
    - name: Install chrony
      apt:
        name: chrony
        state: present

    - name: Enable and start chrony
      service:
        name: chrony
        state: started
        enabled: true

    - name: Enable chrony-wait so time-sync.target means the clock has settled
      service:
        name: chrony-wait
        enabled: true

    - name: Create systemd drop-in directories for kubelet and containerd
      file:
        path: /etc/systemd/system/{{ item }}.service.d
        state: directory
        mode: '0755'
      loop:
        - kubelet
        - containerd

    - name: Order kubelet and containerd after the clock is synchronised
      copy:
        dest: /etc/systemd/system/{{ item }}.service.d/10-time-sync.conf
        mode: '0644'
        content: |
          [Unit]
          After=time-sync.target
      loop:
        - kubelet
        - containerd

    - name: Reload systemd
      systemd:
        daemon_reload: true

    # ── Cluster init ──────────────────────────────────────
    # --pod-network-cidr must stay disjoint from --service-cluster-ip-range, left at the
    # kubeadm default 10.96.0.0/12. Fixed at init time: changing it later needs a rebuild.
    - name: Initialize Kubernetes cluster
      command: >-
        kubeadm init
        --apiserver-advertise-address={{ apiserver_advertise_address }}
        --pod-network-cidr={{ pod_cidr }}
        --skip-phases=addon/kube-proxy
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create .kube directory
      file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy kubeconfig to user home
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ ansible_user }}/.kube/config
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'
    
    # ── Remove control-plane taint ─────────────────────────── (You should not do this for serious clusters)
    # This taint is what makes the only node schedulable, so a swallowed failure ends the
    # run green over a cluster where ArgoCD and everything after it sits Pending, looking
    # like a scheduling problem rather than a bootstrap step that never happened.
    # `failed_when: false` swallowed all of them: API server not up yet, kubeconfig never
    # copied, RBAC denial, node not yet registered. Tolerate only `taint ... not found`,
    # which is what a re-run hits once the taint is already gone.
    #
    # Matched per line rather than across the whole of stderr: kubectl prints one message
    # per failure, so under `--all` a worker that never carried the taint reports `not
    # found` on every run, and a whole-of-stderr test would find that line and pass over a
    # real error standing beside it. Empty stderr stays a failure too -- the command module
    # reports a binary it could not execute as rc 2 with stdout and stderr both empty.
    - name: Remove control-plane taint for single-node cluster
      command: kubectl taint nodes --all node-role.kubernetes.io/control-plane-
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      register: untaint
      changed_when: "'untainted' in untaint.stdout"
      failed_when: >-
        untaint.rc != 0 and
        (untaint.stderr_lines | select | list | length == 0 or
        untaint.stderr_lines | select
        | reject('search', 'taint "node-role.kubernetes.io/control-plane" not found')
        | list | length > 0)

    # The task above decides from what kubectl said; this decides from what the cluster
    # looks like afterwards, so a stderr shape the match does not anticipate cannot end
    # the run green. It also catches the case the parse cannot see at all: a removal that
    # reported success without sticking.
    #
    # Every taint key on every node, matched in the assert rather than by a jsonpath
    # `?(@.key=="...")` filter: `command` splits with shlex, which eats the quotes that
    # filter needs, leaving kubectl to read the bare key as an identifier and exit 1 --
    # taking the play down here, before the assert could report anything.
    - name: Check for a remaining control-plane taint
      command: kubectl get nodes -o jsonpath={.items[*].spec.taints[*].key}
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      register: remaining_taints
      changed_when: false

    - name: Assert the control-plane taint is gone
      assert:
        that: "'node-role.kubernetes.io/control-plane' not in remaining_taints.stdout"
        fail_msg: >-
          A node still carries node-role.kubernetes.io/control-plane, so nothing will
          schedule on this cluster.
        success_msg: no node carries the control-plane taint

    # ── Helm ──────────────────────────────────────────────
    # The release tarball, not get-helm-3 from the branch tip: that script was unpinned,
    # unverified, and ran as root -- and it resolves its own version at runtime anyway.
    #
    # Ahead of the CNI, because Helm is now what installs it. Cilium used to be rendered
    # twice: the Cilium CLI here from a hand-written --set list, and the same chart again
    # inside ArgoCD from values.yaml. Only the two keys this play read back out of that
    # file were held in step, so every other setting existed in two places that agreed by
    # hand -- which is the drift channel behind recover_cilium.sh. One renderer now: this
    # Helm, against system-apps/cilium/. The Cilium CLI is no longer installed; its one
    # remaining advantage was auto-detecting k8sServiceHost, and values.yaml pins that.
    #
    # A missing key leaves this undefined rather than raising, so the assert below can
    # say which architecture had no pinned checksum instead of failing inside Jinja.
    - name: Resolve the release architecture
      set_fact:
        release_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] | default('') }}"

    - name: Assert the architecture has a pinned checksum
      assert:
        that: release_arch != ''
        fail_msg: >-
          No pinned Helm checksum for {{ ansible_facts['architecture'] }}; add one to
          the vars at the top of this play.
        success_msg: "pinning the {{ release_arch }} artefact"

    - name: Check the installed Helm version
      command: helm version --short
      register: helm_installed
      changed_when: false
      failed_when: false

    - name: Install the pinned Helm release
      when: helm_version not in helm_installed.stdout
      block:
        - name: Create a scratch directory for the Helm download
          tempfile:
            state: directory
            suffix: helm
          register: helm_tmp

        - name: Download the pinned Helm release
          get_url:
            url: https://get.helm.sh/helm-{{ helm_version }}-linux-{{ release_arch }}.tar.gz
            dest: "{{ helm_tmp.path }}/helm.tar.gz"
            checksum: sha256:{{ helm_sha256[release_arch] }}
            mode: '0644'

        # Unpacked to the scratch directory rather than straight into /usr/local/bin
        # because this tarball carries its LICENSE and README alongside the binary.
        - name: Unpack Helm
          unarchive:
            src: "{{ helm_tmp.path }}/helm.tar.gz"
            dest: "{{ helm_tmp.path }}"
            remote_src: true

        - name: Install the Helm binary
          copy:
            src: "{{ helm_tmp.path }}/linux-{{ release_arch }}/helm"
            dest: /usr/local/bin/helm
            remote_src: true
            owner: root
            group: root
            mode: '0755'

      always:
        - name: Remove the Helm scratch directory
          file:
            path: "{{ helm_tmp.path }}"
            state: absent
          when: helm_tmp.path is defined

    # ── Cilium CNI ────────────────────────────────────────
    # The chart is an umbrella over the upstream cilium chart, and charts/ and Chart.lock
    # are gitignored -- they are a resolved cache, not source -- so the dependency has to
    # be fetched on the node before anything can render.
    #
    # Gated on the cache, because re-running this play is now the only update path there
    # is and an unconditional resolve makes every re-run need helm.cilium.io reachable --
    # including one that changes nothing. `helm dependency build` is not the fix: it
    # re-downloads the tarball even with a matching Chart.lock and a populated charts/,
    # and --skip-refresh does not change that, so it needs the network just the same.
    #
    # Keyed on the versions Chart.yaml declares, not on charts/ merely being non-empty.
    # That is the difference between a cache check and the `creates:` guard this section
    # exists to be rid of: bump the dependency version and the tarball named below does
    # not exist, so the resolve runs. A version range would never match a literal
    # filename and would simply always resolve, which is the safe direction to fail.
    - name: Read the Cilium chart's declared dependencies
      set_fact:
        cilium_chart: "{{ lookup('file', cilium_chart_dir + '/Chart.yaml') | from_yaml }}"

    - name: Check whether those dependencies are already in the chart's cache
      stat:
        path: "{{ cilium_chart_dir }}/charts/{{ item.name }}-{{ item.version }}.tgz"
      loop: "{{ cilium_chart.dependencies | default([]) }}"
      become: false
      register: cilium_deps_cached

    # become: false, like every task below it: repo_path is inside the operator's home,
    # and a root-owned charts/ there would break the operator's own `helm dependency
    # update` and infrastructure/scripts/check_deployments.sh afterwards.
    - name: Resolve the Cilium chart's dependencies
      command: helm dependency update {{ cilium_chart_dir }}
      become: false
      when: cilium_deps_cached.results | rejectattr('stat.exists') | list | length > 0

    # This used to be `cilium install`/`cilium upgrade` behind
    # `creates: /etc/cni/net.d/05-cilium.conflist`, which made the bootstrap one-shot: the
    # guard skipped the whole task once the conflist existed, so the upgrade branch inside
    # it was unreachable and ArgoCD was the only thing that could change Cilium on a live
    # cluster. Nothing reconciles behind this play any more, so "re-run the playbook" is
    # the only update path there is and it has to actually work. `helm upgrade --install`
    # is its own guard, and needs no `creates:`.
    #
    # No -f: values.yaml sits inside the chart, so it is already the chart's defaults --
    # the same file, read the same way, as `helm template` in check_deployments.sh.
    #
    # Deliberately NOT --wait. Helm counts a LoadBalancer Service as not-ready until
    # .status.loadBalancer.ingress is populated, and this chart renders
    # kube-system/cilium-ingress as exactly that, with no spec.externalIPs to short-circuit
    # the check. That address can only come from LB-IPAM, which needs the
    # CiliumLoadBalancerIPPool applied three tasks below -- which in turn needs a CRD that
    # does not exist until the operator this release starts registers it. --wait here is
    # therefore circular: it blocks for the whole timeout on an address the play has not
    # yet made possible, and only then fails.
    #
    # And it fails expensively on the run that matters. A first bootstrap leaves the
    # release with a single failed *install* revision, so the next `helm upgrade --install`
    # exits with "has no deployed releases" and the node stays wedged until someone runs
    # `helm uninstall cilium` by hand -- on precisely the nuke-and-rebuild path
    # system-apps/README.md nominates for the migration. Nothing warned about this before
    # because nothing waited: `cilium install` never watched that Service, and under ArgoCD
    # an address-less LoadBalancer just left the Application Progressing.
    #
    # What --wait was actually being paid for is the datapath, and that is waited on
    # explicitly below. Deliberately not --atomic either: rolling a half-applied CNI back
    # to the previous release is not a safer place to leave the node than forward.
    #
    # This reports changed on every run and that is honest, not noise: helm has no dry-run
    # that answers "would this change anything" cheaply, and gating the upgrade on the
    # rendered manifest matching the last release would skip the three-way merge that
    # corrects drift -- which, with no reconciler behind it, is the whole point of re-running.
    - name: Install or upgrade Cilium
      command: >-
        helm upgrade --install cilium {{ cilium_chart_dir }}
        --namespace kube-system
        --timeout 10m
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false

    # The half of --wait worth having, named rather than inferred: the tasks after this
    # need a working datapath, or ArgoCD's pods are scheduled against a CNI that is not up
    # and its 120s rollout waits race the agent coming up. Asking about the agent and the
    # operator specifically also keeps the ingress Service -- which cannot have an address
    # this early -- out of the question being asked.
    - name: Wait for the Cilium datapath
      shell: |
        set -eu
        kubectl -n kube-system rollout status ds/cilium --timeout=10m
        kubectl -n kube-system rollout status deploy/cilium-operator --timeout=5m
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      changed_when: false

    # The pool and the L2 policy are CiliumLoadBalancerIPPool and
    # CiliumL2AnnouncementPolicy, and those CRDs are registered by cilium-operator at
    # runtime -- the chart does not ship them under crds/, so the rollout above says the
    # operator is running, not that it has finished registering. Polling for the object
    # first, then waiting on Established: `kubectl wait` errors immediately on a resource
    # that is not there at all, so waiting alone would fail on exactly the cold run this
    # exists for.
    - name: Wait for the Cilium CRDs the configuration below needs
      shell: |
        set -eu
        for crd in ciliumloadbalancerippools.cilium.io ciliuml2announcementpolicies.cilium.io; do
          for _ in $(seq 60); do
            kubectl get crd "$crd" >/dev/null 2>&1 && break
            sleep 2
          done
          kubectl wait --for=condition=established --timeout=60s crd/"$crd"
        done
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      changed_when: false

    # Part of the Cilium unit, not a thing of its own. The ingress pin in values.yaml has
    # to sit inside the pool declared here, and while these were two separately-synced
    # ArgoCD Applications there was no ordering between them: the pair could disagree
    # transiently even with both files correct (#26). One step, ordered after the chart.
    #
    # Stated trade: `kubectl apply -f` has no prune, so deleting a pool from git leaves it
    # in the cluster. Accepted for two small manifests -- deleting one is rare and the
    # cluster tells you loudly when a pool is wrong -- but it is a decision, and removing
    # one of these means also deleting it by hand.
    - name: Apply the Cilium configuration
      command: kubectl apply -f {{ cilium_chart_dir }}/config/
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      register: cilium_config
      changed_when: cilium_config.stdout_lines | reject('search', ' unchanged$') | list | length > 0

    # check_deployments.sh asserts statically that the ingress pin sits inside the pool;
    # this is the cluster confirming it. When they disagree LB-IPAM sets
    # IPAMRequestSatisfied=False on cilium-ingress, the Service never gets an address and
    # every Ingress in the cluster is dead -- and it does not self-heal, because LB-IPAM
    # will not evict a holder to make room. That is the one failure mode this play can
    # observe directly and used not to, so the run went green over a cluster whose ingress
    # had never come up, with nothing reconciling behind it to notice later.
    #
    # A poll and an explicit message rather than `kubectl wait --for=jsonpath=...`: the
    # thing worth having here is the reason, and a bare wait times out saying only that it
    # did. If the Service is missing entirely the get fails under `set -e` -- that means
    # ingressController.enabled was turned off, which check_deployments.sh fails on first.
    - name: Wait for the ingress address to be served
      shell: |
        set -eu
        for _ in $(seq 30); do
          ip=$(kubectl -n kube-system get service cilium-ingress \
                 -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          if [ -n "$ip" ]; then
            echo "cilium-ingress is serving $ip"
            exit 0
          fi
          sleep 2
        done
        echo "cilium-ingress still has no LoadBalancer address after 60s -- LB-IPAM has" >&2
        echo "no pool that can serve the lbipam.cilium.io/ips pin in values.yaml." >&2
        kubectl -n kube-system describe service cilium-ingress >&2
        exit 1
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      changed_when: false

    # ── ArgoCD ────────────────────────────────────────────
    - name: Create argocd namespace
      command: kubectl create namespace argocd
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      register: argocd_ns
      failed_when: argocd_ns.rc != 0 and 'already exists' not in argocd_ns.stderr

    # --server-side, but deliberately not --force-conflicts. The manifest is re-applied
    # on every run, so --force-conflicts is not a one-off override: it standingly takes
    # ownership of any field another manager has set since -- an operator, a hand patch,
    # a chart layered on top -- and reverts it silently on the next run. A conflict is
    # the useful signal that something outside this playbook is managing part of ArgoCD,
    # so let it stop the run and be resolved deliberately. The field manager is left at
    # kubectl's default so this keeps ownership of the fields the earlier forced applies
    # already claimed.
    - name: Install ArgoCD
      command: >
        kubectl apply -n argocd --server-side
        -f https://raw.githubusercontent.com/argoproj/argo-cd/v3.3.11/manifests/install.yaml
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      register: argocd_install
      failed_when: false

    # Deferred to an assert so the failure this play now allows arrives with the reason
    # attached, instead of a raw server-side-apply conflict dump from kubectl.
    - name: Assert the ArgoCD apply succeeded
      assert:
        that: argocd_install.rc == 0
        fail_msg: >-
          kubectl apply failed for ArgoCD. If it reported a conflict, a field manager
          other than kubectl owns part of the pinned manifest -- something outside this
          playbook is managing ArgoCD. Settle that deliberately (take the field back, or
          stop managing it elsewhere); re-adding --force-conflicts would only revert it
          silently on every run. kubectl said: {{ argocd_install.stderr | default('') | trim }}
        success_msg: ArgoCD applied with no field-ownership conflicts

    # argocd-server is not what the gate at the end of this section asks about: the
    # applicationset controller has to reconcile the ApplicationSet and repo-server does the
    # actual clone, and both are separate Deployments. argocd-redis, which repo-server caches
    # through, is a separate image from a separate registry, so it can lag the rest on a cold
    # pull. Waiting only on argocd-server leaves that gate racing all three, and it would
    # report a lost race as a bad deploy key. The applicationset controller ships no
    # readiness probe, so its rollout establishes only that the pod started -- still the
    # difference between waiting for it and not.
    - name: Wait for ArgoCD to be ready
      command: kubectl rollout status deployment/{{ item }} -n argocd --timeout=120s
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      loop:
        - argocd-server
        - argocd-repo-server
        - argocd-applicationset-controller
        - argocd-redis

    # ── ArgoCD repository credential ──────────────────────
    # The generator in argocd/applicationset.yaml is an SSH remote, and ArgoCD cannot clone
    # one without a repository credential in its own namespace. Nothing here used to create
    # it: the live cluster's credential had been made by hand, so a fresh machine ran this
    # play to completion, reported success, created the ApplicationSet -- and then synced
    # nothing, the clone failure surfacing only as repo-server errors in the ArgoCD UI.
    # The URL and the key are both validated in pre_tasks, before any of the bootstrap runs.
    #
    # Server-side apply, so the manifest is not echoed back into a
    # kubectl.kubernetes.io/last-applied-configuration annotation on the Secret. Anything
    # able to read that annotation can read the key from `data` anyway, but the two are not
    # equally exposed: `kubectl describe secret` prints annotations verbatim while printing
    # data values as `<bytes>`, so the client-side annotation is the copy that leaks first.
    # --force-conflicts to match the ArgoCD install above; this play is the only manager of
    # this object.
    #
    # -o suppresses apply's own "serverside-applied" line, which it prints unconditionally
    # -- there is no "unchanged" on this path, so the wording cannot report idempotence the
    # way the client-side one does. The applied object's resourceVersion can: the API server
    # only bumps it when the write actually changed something. Reading it back is also the
    # one thing that can be logged, since the key itself cannot.
    - name: Check whether the ArgoCD repository credential already exists
      command: >
        kubectl get secret {{ argocd_repo_secret_name }} -n argocd --ignore-not-found
        -o jsonpath={.metadata.resourceVersion}
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      register: argocd_repo_secret_before
      changed_when: false

    # Passed on stdin, so the key never reaches the argument list of a process on the node
    # and never lands on disk. `data` rather than `stringData` because a base64 blob is one
    # line: a PEM key spliced into a YAML block scalar has to be re-indented to match, and
    # getting that wrong yields a well-formed Secret holding a corrupt key.
    - name: Register the ArgoCD repository credential
      # Two line-ending accidents, both of which yield a well-formed Secret holding a key
      # OpenSSH will not load, and neither of which any assert above can see. A key that has
      # been through a Windows editor keeps its CRs -- the delimiters still match and the
      # cipher name still sits inside the first base64 line, so it passes everything. And a
      # key round-tripped through the vault easily loses its final newline, which OpenSSH
      # also requires. splitlines/join fixes the first and re-terminates the second; a CRLF
      # key is a correct key that survived a lossy paste, so normalise it rather than
      # rejecting it.
      #
      # Not replace('\r', ''): Jinja normalises newlines inside its own string literals, so
      # that escape becomes '\n' before the filter runs and it deletes the key's line breaks
      # instead of its carriage returns -- 7 lines to 1, still 6 CRs. In a single-quoted YAML
      # scalar it is a silent no-op instead. splitlines() never spells the escape. The
      # trailing "\n" below is safe for the opposite reason: YAML resolves it before Jinja
      # sees it, where inside a literal block it would stay two characters.
      vars:
        deploy_key_pem: "{{ argocd_deploy_key.splitlines() | join('\n') | trim }}\n"
      command: >
        kubectl apply --server-side --force-conflicts -f -
        -o jsonpath={.metadata.resourceVersion}
      args:
        stdin: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: {{ argocd_repo_secret_name }}
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          type: Opaque
          data:
            type: {{ 'git' | b64encode }}
            url: {{ argocd_appset.spec.generators[0].git.repoURL | b64encode }}
            sshPrivateKey: {{ deploy_key_pem | b64encode }}
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      register: argocd_repo_secret
      changed_when: argocd_repo_secret.stdout != argocd_repo_secret_before.stdout
      # Without this the key is echoed back in the task's module arguments on any failure.
      # It costs the diagnostics for this one task; the gate at the end of this section is
      # what reports an unusable credential, and it reads ArgoCD's own error.
      no_log: true

    - name: Apply ArgoCD ApplicationSet
      command: kubectl apply -f {{ system_apps_dir }}/argocd/applicationset.yaml
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false

    # Applying the ApplicationSet only records the object; whether ArgoCD can actually
    # clone the repo behind it is decided afterwards, by the applicationset controller. The
    # credential registered above is necessary for that but not sufficient -- a deploy key
    # revoked on GitHub, granted to the wrong repo, or pasted in truncated all produce a
    # perfectly valid Secret and a repo ArgoCD still cannot read. That is the same silent
    # green run as before, just one step further along, so do not infer success from having
    # applied the manifests. Take the verdict from the controller instead: it reports
    # ResourcesUpToDate once it has resolved the generator, and forces it false whenever a
    # generator errors.
    - name: Wait for the ApplicationSet to resolve its generator
      command: >
        kubectl wait --for=condition=ResourcesUpToDate
        applicationset/{{ argocd_appset.metadata.name }}
        -n argocd --timeout=120s
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      register: appset_ready
      changed_when: false
      failed_when: false

    # kubectl wait reports only that it timed out; the reason sits in the conditions.
    - name: Read the ApplicationSet conditions
      command: >
        kubectl get applicationset {{ argocd_appset.metadata.name }} -n argocd
        -o jsonpath={.status.conditions}
      environment:
        KUBECONFIG: /home/{{ ansible_user }}/.kube/config
      become: false
      when: appset_ready.rc != 0
      register: appset_conditions
      changed_when: false
      failed_when: false

    - name: Assert ArgoCD can reach the deployment repository
      assert:
        that: appset_ready.rc == 0
        fail_msg: >-
          {{ argocd_appset.metadata.name }} never reported ResourcesUpToDate, so ArgoCD is
          generating no Applications and nothing under deployment/ will sync:
          {{ appset_conditions.stdout | default('', true) or appset_ready.stderr }}
        success_msg: ArgoCD has resolved the deployment repository

  handlers:
    - name: restart containerd
      service:
        name: containerd
        state: restarted
